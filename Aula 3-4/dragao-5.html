<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Exercício 3.5 - Filtro e Busca em Tempo Real</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    input {
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 8px;
      border: 1px solid #ccc;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h2>Buscar Tecnologia</h2>

  <input type="text" id="campoBusca" placeholder="Buscar tecnologia..." oninput="filtrarTecnologias()">

  <ul id="listaTecnologias">
    <li>JavaScript</li>
    <li>Python</li>
    <li>HTML</li>
    <li>CSS</li>
    <li>PHP</li>
    <li>Java</li>
  </ul>

  <script>
function filtrarTecnologias() {

  // Converte para minúscula, assim ajuda porque quando digitamos "java" ele vai achar "JavaScript" também, mesmo com a diferença de maiúsculas/minúsculas.
  let termoBuscado = document.querySelector('#campoBusca').value.toLowerCase();

 
  //    querySelectorAll retorna uma lista (NodeList) com todos eles juntos.
  let itensTecnologia = document.querySelectorAll('#listaTecnologias li');

  // 3) Percorre cada <li> um por um.
  for (let i = 0; i < itensTecnologia.length; i++) {

    // Pega o texto daquele item específico (ex: "JavaScript") e também
    // converte pra minúsculas, pra comparar igual com igual.
    let textoItem = itensTecnologia[i].textContent.toLowerCase();

    // 4) .includes() verifica se o termoBuscado está CONTIDO no texto do item.
    //    Ex: "java".includes dentro de "javascript" -> true
    if (textoItem.includes(termoBuscado)) {
      // Se contém o termo buscado, mantém visível
      itensTecnologia[i].style.display = "block";
    } else {
      // Se não contém, esconde o item
      itensTecnologia[i].style.display = "none";
    }
  }
}
    
  </script>
</body>
</html>
