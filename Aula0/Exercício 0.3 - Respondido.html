<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #e9ecef; }
    .box { background: white; padding: 2rem; border-radius: 8px; text-align: center; min-width: 200px; }
    .numero { font-size: 4rem; font-weight: bold; color: #333; margin: 20px 0; }
    .botoes { display: flex; gap: 10px; justify-content: center; }
    button { padding: 10px 18px; font-size: 1.2rem; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Contador</h2>
    <div id="valor" class="numero">0</div>
    <div class="botoes">
      <button id="btn-subtrair">-</button>
      <button id="btn-zerar">Zerar</button>
      <button id="btn-somar">+</button>
    </div>
  </div>

  <script>
    
    const num = document.querySelector("#valor");
    const sub = document.querySelector("#btn-subtrair");
    const adc = document.querySelector("#btn-somar");
    const zer = document.querySelector("#btn-zerar");
    let contador = 0

    adc.addEventListener('click', ()=> {
      contador++
      num.textContent = contador
    
    });

    sub.addEventListener('click', () => {

      if (contador > 0) {
      contador--
      num.textContent = contador
      }
    });

    zer.addEventListener('click', () => {
      contador = 0
      num.textContent = contador
    
    });

  </script>
</body>
</html>
