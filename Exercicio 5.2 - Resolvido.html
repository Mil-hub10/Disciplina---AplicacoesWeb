<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes - ClickPsico</title>
<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
    }

    .container {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .painel-esquerdo select {
        width: 150px;
        height: 180px;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    /* Meio: agora com 2 botões, um embaixo do outro */
    .painel-meio {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .painel-meio button {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    #btnDetalhes {
        background-color: #007bff;
    }

    #btnDetalhes:hover {
        background-color: #0056b3;
    }

    #btnAbrirModal {
        background-color: #28a745;
    }

    #btnAbrirModal:hover {
        background-color: #218838;
    }

    .painel-direito {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 250px;
    }

    .card-info {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 10px;
        background-color: #fafafa;
    }

    .card-info strong {
        display: block;
        color: #555;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .card-info div {
        font-size: 15px;
        color: #333;
    }

    .card-info img {
        max-width: 80px;
        height: auto;
        border-radius: 50%;
        border: 1px solid #ccc;
    }

    /* Modal (janela de formulário) */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background-color: #fff;
        padding: 25px;
        border-radius: 8px;
        width: 320px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .modal-content h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #333;
    }

    .form-group {
        margin-bottom: 12px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        margin-bottom: 4px;
        color: #666;
    }

    .form-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    .modal-acoes {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 15px;
    }

    .modal-acoes button {
        padding: 8px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: #fff;
    }

    .btn-salvar {
        background-color: #28a745;
    }

    .btn-cancelar {
        background-color: #dc3545;
    }
</style>
</head>
<body>

    <div class="container">
        <!-- Esquerda: Listbox com os nomes dos pacientes -->
        <div class="painel-esquerdo">
            <select id="selectPacientes" size="5">
                <option value="0" selected>Ana Souza</option>
                <option value="1">Bruno Lima</option>
                <option value="2">Carla Dias</option>
                <option value="3">Diego Martins</option>
                <option value="4">Elisa Ferreira</option>
            </select>
        </div>

        <!-- Meio: Botões -->
        <div class="painel-meio">
            <button id="btnDetalhes">Detalhes</button>
            <button id="btnAbrirModal">Novo Paciente</button>
        </div>

        <!-- Direita: Quatro divs/quadros de informações -->
        <div class="painel-direito">
            <div class="card-info">
                <strong>Data de Nascimento</strong>
                <div id="divNascimento">-</div>
            </div>
            <div class="card-info">
                <strong>Telefone</strong>
                <div id="divTelefone">-</div>
            </div>
            <div class="card-info">
                <strong>Endereço</strong>
                <div id="divEndereco">-</div>
            </div>
            <div class="card-info">
                <strong>Foto</strong>
                <div id="divFoto">-</div>
            </div>
        </div>
    </div>

    <!-- Modal de formulário para cadastrar um novo paciente -->
    <div class="modal-overlay" id="modalForm">
        <div class="modal-content">
            <h3>Cadastrar Novo Paciente</h3>
            <div class="form-group">
                <label for="inputNome">Nome:</label>
                <input type="text" id="inputNome" placeholder="Ex: Fernanda Alves">
            </div>
            <div class="form-group">
                <label for="inputNascimento">Data de Nascimento:</label>
                <input type="text" id="inputNascimento" placeholder="Ex: 15/05/1992">
            </div>
            <div class="form-group">
                <label for="inputTelefone">Telefone:</label>
                <input type="text" id="inputTelefone" placeholder="Ex: (11) 95544-3322">
            </div>
            <div class="form-group">
                <label for="inputEndereco">Endereço:</label>
                <input type="text" id="inputEndereco" placeholder="Ex: Rua Haddock Lobo, 987">
            </div>
            <div class="form-group">
                <label for="inputFoto">URL da Foto:</label>
                <input type="url" id="inputFoto" placeholder="https://i.pravatar.cc/150?img=5">
            </div>
            <div class="modal-acoes">
                <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
                <button type="button" class="btn-salvar" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        // 5 Arrays paralelos com informações fictícias dos pacientes
        // (mesmo índice em cada array = mesmo paciente)
        // Eles ficam na memória RAM: os dados existem enquanto a página está aberta
        // e voltam ao estado inicial se a página for recarregada.
        const nomes       = ["Ana Souza", "Bruno Lima", "Carla Dias", "Diego Martins", "Elisa Ferreira"];
        const nascimentos = ["12/03/1990", "25/07/1985", "03/11/2001", "19/01/1978", "08/09/1995"];
        const telefones   = ["(11) 98765-4321", "(11) 91234-5678", "(11) 99988-7766", "(11) 97766-5544", "(11) 96655-4433"];
        const enderecos   = ["Rua das Flores, 123", "Av. Paulista, 456", "Rua Augusta, 789", "Rua Oscar Freire, 321", "Av. Brigadeiro, 654"];
        const fotos = [
            "https://i.pravatar.cc/150?img=1",
            "https://i.pravatar.cc/150?img=12",
            "https://i.pravatar.cc/150?img=25",
            "https://i.pravatar.cc/150?img=33",
            "https://i.pravatar.cc/150?img=47"
        ];

        // Mapeamento dos elementos da DOM
        const selectPacientes = document.getElementById("selectPacientes");
        const btnDetalhes     = document.getElementById("btnDetalhes");
        const btnAbrirModal   = document.getElementById("btnAbrirModal");
        const btnCancelar     = document.getElementById("btnCancelar");
        const btnSalvar       = document.getElementById("btnSalvar");
        const modalForm       = document.getElementById("modalForm");
        const divNascimento   = document.getElementById("divNascimento");
        const divTelefone     = document.getElementById("divTelefone");
        const divEndereco     = document.getElementById("divEndereco");
        const divFoto         = document.getElementById("divFoto");

        // EventListener para o evento de clique do botão "Detalhes"
        btnDetalhes.addEventListener("click", function() {
            // Pega o índice selecionado na listbox
            const index = selectPacientes.value;

            // Se houver seleção válida
            if (index !== "") {
                // Preenche as divs usando o MESMO índice em cada array paralelo
                // (é essa sincronia pelo índice que conecta os dados do "mesmo" paciente)
                divNascimento.textContent = nascimentos[index];
                divTelefone.textContent   = telefones[index];
                divEndereco.textContent   = enderecos[index];

                // Para a foto, usa innerHTML pra montar a tag <img> com template string
                divFoto.innerHTML = `<img src="${fotos[index]}" alt="Foto de ${nomes[index]}">`;
            }
        });

        // Abre o modal com o formulário
        btnAbrirModal.addEventListener("click", function() {
            modalForm.style.display = "flex";
        });

        // Cancelar: fecha o modal e limpa os campos
        btnCancelar.addEventListener("click", function() {
            modalForm.style.display = "none";
            limparFormulario();
        });

        // Salvar: guarda o novo paciente na memória RAM (nos arrays)
        btnSalvar.addEventListener("click", function() {
            const nome       = document.getElementById("inputNome").value.trim();
            const nascimento = document.getElementById("inputNascimento").value.trim();
            const telefone   = document.getElementById("inputTelefone").value.trim();
            const endereco   = document.getElementById("inputEndereco").value.trim();
            const foto       = document.getElementById("inputFoto").value.trim();

            // Validação simples: nenhum campo pode ficar vazio
            if (!nome || !nascimento || !telefone || !endereco || !foto) {
                alert("Por favor, preencha todos os campos!");
                return;
            }

            // Adiciona cada valor ao FINAL do seu array usando .push()
            // Como todos recebem o push na mesma hora, o índice continua sincronizado
            nomes.push(nome);
            nascimentos.push(nascimento);
            telefones.push(telefone);
            enderecos.push(endereco);
            fotos.push(foto);

            // O índice do paciente novo é a última posição do array
            const novoIndex = nomes.length - 1;

            // Cria a nova opção e adiciona na listbox
            // (o value da opção é o índice, igual nas opções originais)
            const novaOpcao = document.createElement("option");
            novaOpcao.value = novoIndex;
            novaOpcao.textContent = nome;
            selectPacientes.appendChild(novaOpcao);

            // Deixa o paciente novo selecionado na listbox
            selectPacientes.value = novoIndex;

            // Fecha o modal e limpa os campos
            modalForm.style.display = "none";
            limparFormulario();
        });

        // Limpa os campos do formulário
        function limparFormulario() {
            document.getElementById("inputNome").value       = "";
            document.getElementById("inputNascimento").value = "";
            document.getElementById("inputTelefone").value   = "";
            document.getElementById("inputEndereco").value   = "";
            document.getElementById("inputFoto").value       = "";
        }
    </script>

</body>
</html>
